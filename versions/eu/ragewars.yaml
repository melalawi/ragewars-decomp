    # j/jal targets: 7328 of 12832 in-range targets land on a function start, against 1245
    # for the runner-up -- a 5.9x margin. It is also this cartridge's header boot address
    # 0x80000400 plus the 0x200000 relocation delta, so two lines of evidence agree.
    # The segment ends at 0x0F9000, where this cartridge's 0x80400000 overlay begins. The
    # CIC checksum's extent (0x100000 bytes from 0x1000, tools/decomp/n64crc.py) cannot
    # bound it here as it does on the North American cartridges: on this build that extent
    # runs into the overlay's text, so the overlay's own start is the boundary.
    # Text ends at 0x0C2DF0, the last return of the main run plus its delay slot; the
    # resident data block runs from there to the overlay.
