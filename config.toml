# Turok: Rage Wars Metadata

[project]
slug = "ragewars"
repo = "https://github.com/melalawi/ragewars-decomp"
title = "Turok: Rage Wars"
tracker_title = "Turok - Rage Wars"
reference = "us-rev1"

[[region]]
name = "main"

[[region]]
name = "code_80400000"

[target]
linker = "artifacts/{version}/{slug}.ld"
text_alignment = "data/text-alignment/{version}.json"

[split]
linker = "versions/{version}/{slug}.ld"
include = "splat/include"
# False: this project's extraction writes both tables [split].generated_symbols names (the toolkit's
# convention) from the split every time it runs,
# so the repository must not carry them. A committed copy is a derived store that looks
# editable, and a correction written into one survives exactly until the next extraction and is
# then erased with nothing said; corrections belong in [split].symbols, which is committed and which
# the extraction reads. Both are in .gitignore, and `check sources` refuses a tracked one by name.
generated_symbols_tracked = false
objects = "artifacts/{version}/obj"
asm_objects = "artifacts/{version}/obj/asm/nonmatchings"
subalign = 4
# How far apart in the ROM file this cartridge's filler repeats. The contract this satisfies is the
# toolkit's docs/contract.md, not a document of this repository's: read as project-relative it names a
# file that is not here, which is the ambiguity rather than a missing document.
filler_mirror_distance = 0x1000

[source]
shared_structs = "splat/types/shared"
include = ["splat/include", "splat/types"]

[toolchain]
# The build graph: this project displaces the cartridge's own assembly one interval at a time.
graph = "sn64"
# The block whose assembler assembles the cartridge's own extracted assembly.
assembly = "gcc-2.8.1"
asflags = ["-Isplat/include"]
objdump_machine = "mips:4000"

# The one compiler that built every cartridge here; every split segment below names it.
[toolchains."gcc-2.8.1"]
kind = "sn64"
cc = "{toolkit}/sn64/cc"
as = "{toolkit}/sn64/as"
# The assembler that reproduces this cartridge's words, by the banner it prints (`asn64.exe` run with no
# arguments). A lean scorer stands in for the build's driver only when it drives this same assembler.
assembler = "SN ASN64 version 2.81"
# The options cc1 compiles every object with, then the project's own. They were the driver's until the
# driver ran two releases of cc1 and one refused the other's options, so they are stated here, in the
# order the driver used to give them.
cflags = ["-Iinclude", "-Isplat/include", "-Isplat/types", "-G0", "-mips3", "-O2", "-mgas", "-meb",
          "-mcpu=VR4300", "-mhard-float", "-mgp32", "-mfp64", "-mno-fix4300", "-O2"]
pins = "{toolkit}/sn64/toolchain.sha256"
installed = "artifacts/sn64"
# Where the diagnostic build of that compiler is installed: the same compiler plus the
# local-allocation decision log, which is the one pass whose choices its released streams do
# not record. It is a separate directory from `installed` and is verified against a separate
# digest file, because it must never be the thing a match is proved with.
diagnostic_installed = "artifacts/sn64-diagnostic"

[rodata]
segment = "main_code"
resident_delta = 0x200000
table_entry_bias = 0x80000000
quarantine = 0xB0000000

# Where `make cartridge-differences` writes what it measured, and what the README's difference matrix
# is rendered from. One record for the project and not one per cartridge: every figure in it is about
# a pair of cartridges, so no single cartridge owns it and five cartridges naming it would be five
# statements of one fact with nothing keeping them equal. `decomp/compare.py` wrote this path and
# `decomp/readme.py` read it, each spelling it for itself, so the file the README depends on was named
# by nothing here at all.
[differences]

# The spans `make cartridge-differences` compares on their own, beside the whole image. Where the
# loaded program ends and the packed data begins is a fact about these cartridges, so it is stated
# here rather than assumed by the measurement.
#
# main_code is the extent the CIC checksum covers. That extent is fixed by the boot protocol and not
# chosen by this project or by any one build, which is what makes it name the same region of every
# cartridge and the only code window comparable before a version is split. assets runs to the end of
# the image and on every cartridge here holds packed data rather than code, which makes it the window
# least disturbed by a rebuild; it states no length because it has none of its own.
[[differences.windows]]
name = "main_code"
start = 0x1000
bytes = 0x100000

[[differences.windows]]
name = "assets"
start = 0x200000

[checks]
inline_asm_keywords = ["asm", "__asm", "__asm__"]
# The one word of data an authored object may emit in .text beside its function, per function. It is a
# fact about the object, so it holds on every cartridge that links the source.
allowed_text_residue = {func_802C0390 = "00000000"}
forbidden_labels = ["PAL"]
# The upstream source trees a note may cite a path in ("from ultralib src/audio/load.c").
note_upstreams = ["ultralib"]
# Raw offset access is refused, marked or not: a pointer cast of a byte pointer plus an offset,
# `(T *)((char|u8|s8 *)x + n)`, dereferenced or not. Matched after preprocessing, so a macro cannot hide it.
forbidden_source_forms = {raw-offset-access = '\(\s*[A-Za-z_]\w*(?:\s+[A-Za-z_]\w*)*\s*\*+\s*\)\s*\(\s*\(\s*(?:(?:unsigned|signed)\s+)?(?:char|u8|s8)\s*\*\s*\)'}

# Where `make readme` writes each cartridge's progress report for decomp.dev, in objdiff's report
# format, and the GitHub Actions workflow that uploads every one as the `<id>_report` artifact
# decomp.dev reads. Both are rendered from the measurement README.md is rendered from, and `make check`
# refuses either when it differs. CI builds nothing and never holds a cartridge: it uploads these.
[tracker]
report = "data/progress-report/{version}.json"
workflow = ".github/workflows/progress-report.yml"

# Each cartridge defines two macros, its own and its family's. The family macro is shared between the
# cartridges it covers on purpose: most differences between related releases belong to the family
# rather than to one release, so a guard over a family is one condition instead of a disjunction over
# its members that a sixth cartridge would have to be added to by hand. Sharing is safe because what
# must hold is that no two cartridges define the same complete *set* of macros, which `version_macros`
# refuses: each cartridge still names its own, so every pair is still separable by a guard.
#
# Two families, stated rather than derived from `region` or `code`. The NTSC pair and the three PAL
# releases have no order between them, and taking a family from a field that happens to correlate
# today is the derived-behind-your-back default this description refuses everywhere else.
[[cartridge]]
id = "us"
name = "North America"
region = "North America"
cartridge = "NUS-NRWE-0"
code = "NRWE"
revision = 0
bytes = 8388608
sha1 = "9f8cb190831945f6f707aa8c2b20e04fa4276795"
sha256 = "0433043aaba2649bdd1fe717c4020550ac663c0362527aa082490f5977a3e46b"
crc1 = "ADB9498B"
crc2 = "DAF28F55"
buildable = true
note = "First NTSC release (black cartridge)."
version_macro = "VERSION_US"
family_macro = "VERSION_NTSC"

[cartridge.rodata]
resident_blocks = ["data/D_802C18F0"]

[cartridge.split]
link_symbols = ["versions/{version}/symbol_addrs.txt", "versions/{version}/undefined_syms_auto.txt", "versions/{version}/undefined_funcs_auto.txt"]
c_objects = "artifacts/{version}/obj/src"

[[cartridge.split.segments]]
toolchain = "gcc-2.8.1"
name = "main_code"
source = "subsegments"
region = "main"
vram = 0x80200400
rom = 0x1000

[[cartridge.split.segments]]
