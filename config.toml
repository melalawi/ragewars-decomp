# Version values: a quantity the cartridges hold differently, stated with its value on every
# cartridge. Each is shown from the bytes: the same immediate at the same aligned instruction of two
# or more functions, and the same value on every cartridge each time (stack offsets and branches
# are code, not values, and are left out). Named by the reference cartridge's value until someone
# learns what each one is; each build defines every name to its own cartridge's value, and the
# near-twin measure and `try` name a difference that is exactly one of these.

